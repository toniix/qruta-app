<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/qruta-icon-512.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111B2E" />
    <meta
      name="description"
      content="QRuta: información de transporte público, paraderos, frecuencias y rutas en tiempo real."
    />
    <link rel="preconnect" href="https://back.anthonywar.dev" crossorigin />
    <link rel="dns-prefetch" href="https://back.anthonywar.dev" />
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://a.basemaps.cartocdn.com" />
    <title>QRuta · Menos preguntas, más viajes</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100dvh;background-color:#f7f9fc;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;">
        <header style="background-color:#111b2e;padding:16px 16px 20px;border-bottom:1px solid #29364a;display:flex;flex-direction:column;gap:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#b7f34a,#537d13);display:flex;align-items:center;justify-content:center;font-weight:bold;color:#111b2e;font-size:14px;">Q</div>
              <span style="color:#ffffff;font-weight:700;font-size:18px;letter-spacing:-0.02em;">QRuta</span>
            </div>
            <div style="height:28px;width:76px;border-radius:9999px;background-color:#17243a;border:1px solid #29364a;"></div>
          </div>
          <div style="height:44px;border-radius:12px;background-color:#17243a;border:1px solid #29364a;"></div>
          <div style="height:32px;width:180px;border-radius:9999px;background-color:#17243a;border:1px solid #29364a;"></div>
        </header>
        <main style="flex:1;padding:16px;display:flex;flex-direction:column;gap:16px;">
          <div style="height:20px;width:140px;border-radius:6px;background-color:#e2e8f0;"></div>
          <div style="display:flex;gap:12px;overflow:hidden;">
            <div style="height:90px;width:240px;border-radius:16px;background-color:#ffffff;border:1px solid #e2e8f0;flex-shrink:0;"></div>
            <div style="height:90px;width:240px;border-radius:16px;background-color:#ffffff;border:1px solid #e2e8f0;flex-shrink:0;"></div>
          </div>
          <div style="height:20px;width:120px;border-radius:6px;background-color:#e2e8f0;margin-top:8px;"></div>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div style="height:72px;border-radius:16px;background-color:#ffffff;border:1px solid #e2e8f0;"></div>
            <div style="height:72px;border-radius:16px;background-color:#ffffff;border:1px solid #e2e8f0;"></div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
