<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/qruta-icon-512.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111B2E" />
    <meta
      name="description"
      content="QRuta: información de transporte público, paraderos, frecuencias y rutas en tiempo real."
    />
    <link rel="preconnect" href="https://back.anthonywar.dev" crossorigin />
    <link rel="dns-prefetch" href="https://back.anthonywar.dev" />
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://a.basemaps.cartocdn.com" />
    <title>QRuta · Menos preguntas, más viajes</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100dvh;background-color:#111b2e;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;justify-content:space-between;">
        <header style="padding:16px 20px;border-bottom:1px solid #1f2d45;display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#b7f34a,#537d13);display:flex;align-items:center;justify-content:center;font-weight:900;color:#111b2e;font-size:16px;">Q</div>
            <span style="color:#ffffff;font-weight:800;font-size:20px;letter-spacing:-0.03em;">QRuta</span>
          </div>
          <div style="height:26px;width:64px;border-radius:9999px;background-color:#17243a;border:1px solid #29364a;"></div>
        </header>

        <main style="flex:1;display:flex;align-items:center;justify-content:center;">
          <div style="width:34px;height:34px;border-radius:50%;border:3px solid rgba(183,243,74,0.18);border-top-color:#b7f34a;animation:qruta-spin 0.8s linear infinite;"></div>
        </main>

        <footer style="height:56px;border-top:1px solid #1f2d45;background-color:#111b2e;"></footer>
      </div>
      <style>
        @keyframes qruta-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
