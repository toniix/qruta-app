# Test profile.
#
# Tests must never touch the real database. This file points the context at a
# throwaway local database (rutas_test) and provides every value that would
# otherwise come from .env, so the suite runs without .env and without network.
#
# The database needs PostGIS: the entities map geometry(Point, 4326) columns.
#   createdb rutas_test && psql -d rutas_test -c 'CREATE EXTENSION IF NOT EXISTS postgis'
#
# Tests that need the database are annotated with @RequiresTestDatabase and are
# skipped when rutas_test is unreachable.

spring.datasource.url=jdbc:postgresql://localhost:5432/rutas_test
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate owns the schema in tests; Flyway stays off.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# No fixtures, no admin seeding, no outbound calls.
app.seed.enabled=false
geocode.google-api-key=
geocode.daily-quota=0

# Dummy value: the real secret must never be needed to run tests.
app.jwt.secret=test-only-secret-not-for-production-use-0123456789abcdef
app.jwt.expiration-ms=3600000

# Storage unconfigured on purpose: uploads are unit-tested with mocks.
supabase.url=
supabase.service-key=
