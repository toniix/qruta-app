spring.application.name=rutas
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (Supabase)
spring.datasource.url=${DB_URL:jdbc:postgresql://db.dsexslhywpoflyagrnbu.supabase.co:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA + Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# SQL logging off by default: formatted logging is expensive and must never ship to prod.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
# Fail fast on lazy access outside a transaction instead of silently issuing one
# query per entity (the N+1 that made /admin/routes take ~7s). Every service read
# method is annotated @Transactional(readOnly = true) to support this.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://front.anthonywar.dev}

# Flyway: disabled by default (local dev keeps ddl-auto=update).
# Prod enables it via profile/env and baselines the existing schema at V7,
# so only NEW migrations (V8+) run there. Never run ddl-auto=update on prod.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=7
spring.flyway.validate-on-migrate=true

# Seed data (dev fixtures + default admin). OFF by default; local enables it.
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.admin-email=${ADMIN_SEED_EMAIL:admin@rutasya.pe}
# No default: admin seeding is skipped with a warning when unset.
app.seed.admin-password=${ADMIN_SEED_PASSWORD:}

# Reverse-geocode proxy (task 4.1): Google key empty = unconfigured -> Photon always.
geocode.google-api-key=${GOOGLE_MAPS_API_KEY:}
# Max Google attempts per calendar day, counted in-memory (single instance).
geocode.daily-quota=${GEOCODE_DAILY_QUOTA:1000}
# Addresses are stable: long TTL on the rounded-coordinate cache.
spring.cache.caffeine.spec=expireAfterWrite=30d,maximumSize=10000

# Supabase Storage (stop reference images, task stop-reference-image).
# Empty SUPABASE_URL / SUPABASE_SERVICE_KEY => image feature disabled (503).
# The service_role key is server-only and never reaches the frontend.
supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:stop-images}
# Multipart uploads: Boot defaults to 1MB, which would reject valid 2MB images.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# Active profile resolves from the environment. Local default; production
# sets SPRING_PROFILES_ACTIVE=prod on the platform (Render env vars).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

