# Production profile. Activated with SPRING_PROFILES_ACTIVE=prod (Render env vars).
# Every value here is a SAFE default: even if an env var is missed, the app
# will never auto-modify the schema nor seed dev fixtures in production.
spring.application.name=rutas

# Never touch the schema implicitly: Flyway owns migrations, Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Migrations run on startup; the existing prod schema (already at V7 state)
# is baselined once via baseline-on-migrate, then only NEW versions apply.
spring.flyway.enabled=true

# No dev fixtures, no default admin. Create the real admin directly in the DB.
app.seed.enabled=false
